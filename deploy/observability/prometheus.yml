global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8080"]
  - job_name: assembly-service
    metrics_path: /metrics
    static_configs:
      - targets: ["assembly-service:8085"]
