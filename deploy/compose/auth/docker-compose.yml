services:
  auth-service:
    build:
      context: ../../..
      dockerfile: AuthService/Dockerfile
    image: auth-service:latest
    container_name: auth_service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@auth-postgres:5432/${POSTGRES_NAME}?sslmode=disable
      REDIS_ADDRESS: auth-redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SESSION_TTL: ${SESSION_TTL:-24h}
      MIGRATIONS_PATH: migrations
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: ${GRPC_PORT:-50054}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: ${HTTP_PORT:-8084}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_AS_JSON: ${LOGGER_AS_JSON:-true}
    ports:
      - "50054:50054"
      - "8084:8084"
    depends_on:
      auth-postgres:
        condition: service_healthy
      auth-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - microservices-net

  auth-postgres:
    image: postgres:17.0-alpine3.20
    container_name: auth_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

  auth-redis:
    image: redis:8.0-alpine
    container_name: auth_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - auth_redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

volumes:
  auth_postgres_data:
  auth_redis_data:

networks:
  microservices-net:
    external: true
