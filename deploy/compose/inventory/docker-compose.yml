services:
  inventory-service:
    build:
      context: ../../..
      dockerfile: InventoryService/Dockerfile

    image: inventory-service:latest
    container_name: inventory_service

    environment:
      MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@inventory_mongo:27017/?authSource=admin"
      MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_COLLECTION: parts
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: ${GRPC_PORT:-50052}
      LOGGER_LEVEL: ${LOGGER_LEVEL:-info}
      LOGGER_AS_JSON: ${LOGGER_AS_JSON:-true}

    ports:
      - "50052:50052"

    depends_on:
      inventory_mongo:
        condition: service_healthy
      inventory-seed:
        condition: service_completed_successfully

    restart: unless-stopped

    networks:
      - microservices-net

  inventory-seed:
    image: mongo:7.0.5
    container_name: inventory_seed

    command:
      - mongosh
      - --host
      - inventory_mongo
      - --username
      - ${MONGO_INITDB_ROOT_USERNAME}
      - --password
      - ${MONGO_INITDB_ROOT_PASSWORD}
      - --authenticationDatabase
      - admin
      - --file
      - /seed/seed.js

    volumes:
      - ./init/seed.js:/seed/seed.js:ro

    depends_on:
      inventory_mongo:
        condition: service_healthy

    restart: "no"

    networks:
      - microservices-net


  inventory_mongo:
    image: mongo:7.0.5
    container_name: inventory_mongo
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongo_inventory_data:/data/db

    ports:
      - "27017:27017"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - microservices-net

volumes:
  mongo_inventory_data:

networks:
  microservices-net:
    external: true
