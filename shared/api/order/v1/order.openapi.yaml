openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
servers:
  - url: /
tags:
  - name: Orders
paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Создать заказ
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Заказ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/orders/{order_uuid}:
    parameters:
      - $ref: '#/components/parameters/OrderUUID'
    get:
      tags: [Orders]
      summary: Получить заказ
      operationId: getOrder
      responses:
        '200':
          description: Данные заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orders/{order_uuid}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderUUID'
    post:
      tags: [Orders]
      summary: Оплатить заказ
      operationId: payOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayOrderRequest'
      responses:
        '200':
          description: Заказ оплачен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/orders/{order_uuid}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderUUID'
    post:
      tags: [Orders]
      summary: Отменить заказ
      operationId: cancelOrder
      responses:
        '204':
          description: Заказ отменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    OrderUUID:
      name: order_uuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Заказ не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Операция недоступна для текущего состояния заказа
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Зависимый сервис недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateOrderRequest:
      type: object
      required: [user_uuid, part_uuids]
      properties:
        user_uuid:
          type: string
          format: uuid
        part_uuids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    CreateOrderResponse:
      type: object
      properties:
        order_uuid:
          type: string
          format: uuid
        total_price:
          type: number
          format: double
    PayOrderRequest:
      type: object
      required: [payment_method]
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
    PayOrderResponse:
      type: object
      properties:
        transaction_uuid:
          type: string
          format: uuid
    Order:
      type: object
      properties:
        order_uuid:
          type: string
          format: uuid
        user_uuid:
          type: string
          format: uuid
        part_uuids:
          type: array
          items:
            type: string
            format: uuid
        total_price:
          type: number
          format: double
        transaction_uuid:
          type: string
          format: uuid
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, CANCELLED]
    PaymentMethod:
      type: string
      enum:
        - PAYMENT_METHOD_CARD
        - PAYMENT_METHOD_SBP
        - PAYMENT_METHOD_CREDIT_CARD
        - PAYMENT_METHOD_INVESTOR_MONEY
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items: {}
