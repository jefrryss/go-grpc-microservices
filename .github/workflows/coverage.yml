name: Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-and-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - OrderService
          - InventoryService
          - PaymentService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache-dependency-path: "**/go.sum"

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: go test ./...

  coverage:
    name: Update coverage badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.1"
          cache-dependency-path: "**/go.sum"

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: "3.51.1"

      - name: Run coverage tests
        run: task test-coverage

      - name: Read coverage
        id: coverage
        shell: bash
        run: |
          set -euo pipefail

          read_coverage() {
            local service="$1"
            local output_name="$2"
            local value
            value=$(go tool cover -func="coverage/${service}.out" | awk '/^total:/ {gsub("%", "", $3); print $3}')

            if [[ -z "${value}" ]]; then
              echo "Coverage was not calculated for ${service}" >&2
              exit 1
            fi

            echo "${output_name}=${value}" >> "${GITHUB_OUTPUT}"
          }

          read_coverage "OrderService" "order"
          read_coverage "InventoryService" "inventory"
          read_coverage "PaymentService" "payment"

      - name: Update README badges
        shell: bash
        env:
          ORDER_COVERAGE: ${{ steps.coverage.outputs.order }}
          INVENTORY_COVERAGE: ${{ steps.coverage.outputs.inventory }}
          PAYMENT_COVERAGE: ${{ steps.coverage.outputs.payment }}
        run: |
          set -euo pipefail

          update_badge() {
            local service="$1"
            local coverage="$2"
            local color

            color=$(awk -v value="${coverage}" 'BEGIN {
              if (value < 50) print "red"
              else if (value < 80) print "yellow"
              else print "brightgreen"
            }')

            sed -i -E "/\\*\\*${service}\\*\\*/ s#Coverage-[0-9]+(\\.[0-9]+)?%25-[a-z]+#Coverage-${coverage}%25-${color}#" Readme.md
          }

          update_badge "OrderService" "${ORDER_COVERAGE}"
          update_badge "InventoryService" "${INVENTORY_COVERAGE}"
          update_badge "PaymentService" "${PAYMENT_COVERAGE}"

          {
            echo "## Test coverage"
            echo
            echo "| Service | Coverage |"
            echo "| --- | ---: |"
            echo "| OrderService | ${ORDER_COVERAGE}% |"
            echo "| InventoryService | ${INVENTORY_COVERAGE}% |"
            echo "| PaymentService | ${PAYMENT_COVERAGE}% |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Commit updated badges
        shell: bash
        run: |
          if git diff --quiet -- Readme.md; then
            echo "Coverage badges are already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Readme.md
          git commit -m "docs(readme): update coverage badges"
          git push origin HEAD:main
