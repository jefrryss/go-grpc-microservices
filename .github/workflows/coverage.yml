name: Test Coverage Badges

on:
  push:
    branches:
      - main # Пайплайн будет запускаться при каждом пуше в main

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем GitHub Actions делать коммиты в репозиторий

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 📊 Calculate Coverage and Update README
        run: |
          get_badge() {
            local dir=$1
            echo "👉 ЗАПУСК ТЕСТОВ ДЛЯ: $dir"
            cd $dir
            
            # Скачиваем зависимости, если их нет
            go mod download
            
            # ЗАПУСКАЕМ ТЕСТЫ БЕЗ /dev/null, ЧТОБЫ ВИДЕТЬ ОШИБКИ В ЛОГАХ
            go test -coverprofile=cover.out ./... || echo "❌ Ошибка при выполнении тестов в $dir"
            
            # Проверяем, создался ли файл cover.out
            if [ -f "cover.out" ]; then
              COV=$(go tool cover -func=cover.out | grep total | grep -Eo '[0-9]+\.[0-9]+' || echo "0.0")
            else
              echo "❌ Файл cover.out не найден!"
              COV="0.0"
            fi
            
            COLOR=$(echo "$COV" | awk '{if ($1 < 50) print "red"; else if ($1 < 80) print "yellow"; else print "brightgreen"}')
            echo "<img src=\"https://img.shields.io/badge/Coverage-${COV}%25-${COLOR}\" />"
            cd ..
          }

          ORDER_BADGE=$(get_badge "OrderService")
          INV_BADGE=$(get_badge "InventoryService")
          PAY_BADGE=$(get_badge "PaymentService")

          sed -i "s|.*|$ORDER_BADGE|" README.md
          sed -i "s|.*|$INV_BADGE|" README.md
          sed -i "s|.*|$PAY_BADGE|" README.md