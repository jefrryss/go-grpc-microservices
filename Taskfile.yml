version: "3"

vars:
  MODULES: AssemblyService AuthService InventoryService NotificationService OrderService PaymentService platform shared
  COVERAGE_MODULES: AssemblyService AuthService InventoryService NotificationService OrderService PaymentService
  COVERAGE_DIR: "{{.ROOT_DIR}}/coverage"
  BUF: "{{.ROOT_DIR}}/shared/bin/buf"

tasks:
  default:
    cmds:
      - task --list

  env:init:
    internal: true
    cmds:
      - test -f deploy/env/.env || cp deploy/env/.env.example deploy/env/.env

  env:generate:
    desc: Создаёт локальные env-файлы для Docker Compose
    deps: [env:init]
    cmds:
      - ./deploy/env/generate-env.sh

  generate:
    desc: Проверяет protobuf-контракты и генерирует Go, gRPC Gateway и Swagger
    dir: shared/proto
    cmds:
      - "{{.BUF}} lint"
      - "{{.BUF}} generate"
      - cp ../api/swagger/order.swagger.json ../../OrderService/api/swagger/order.swagger.json

  format:
    desc: Форматирует Go-код
    cmds:
      - |
        for module in {{.MODULES}}; do
          find "$module" -name '*.go' -type f -exec gofmt -w {} +
        done

  vet:
    desc: Запускает go vet во всех модулях
    cmds:
      - |
        set -e
        for module in {{.MODULES}}; do
          echo "vet $module"
          (cd "$module" && go vet ./...)
        done

  test:
    desc: Запускает unit-тесты всех модулей
    cmds:
      - |
        set -e
        for module in {{.MODULES}}; do
          echo "test $module"
          (cd "$module" && go test ./...)
        done

  test-integration:
    desc: Запускает тесты PostgreSQL и MongoDB через Testcontainers
    cmds:
      - go test -tags=integration ./InventoryService/tests/integration ./OrderService/tests/integration

  test-coverage:
    desc: Считает покрытие service, repository и api по каждому сервису
    cmds:
      - |
        set -e
        rm -rf {{.COVERAGE_DIR}}
        mkdir -p {{.COVERAGE_DIR}}

        for module in {{.COVERAGE_MODULES}}; do
          packages=$(go list ./$module/... | grep -E '/internal/(service|repository|api)' | grep -vE '/(mocks|testdata)' | paste -sd ',' - || true)
          if [ -z "$packages" ]; then
            continue
          fi
          go test -covermode=atomic -coverpkg="$packages" -coverprofile={{.COVERAGE_DIR}}/$module.out $(echo "$packages" | tr ',' ' ')
          printf '%s: ' "$module"
          go tool cover -func={{.COVERAGE_DIR}}/$module.out | tail -n 1
        done

        {
          echo "mode: atomic"
          find {{.COVERAGE_DIR}} -name '*.out' ! -name total.out -exec grep -h -v '^mode:' {} +
        } > {{.COVERAGE_DIR}}/total.out
        printf 'total: '
        go tool cover -func={{.COVERAGE_DIR}}/total.out | tail -n 1

  coverage:html:
    desc: Создаёт HTML-отчёт покрытия
    deps: [test-coverage]
    cmds:
      - go tool cover -html={{.COVERAGE_DIR}}/total.out -o {{.COVERAGE_DIR}}/coverage.html
      - open {{.COVERAGE_DIR}}/coverage.html || true

  up:
    desc: Собирает и запускает приложение, брокер, базы, gateway и observability
    deps: [env:generate]
    cmds:
      - docker compose -f deploy/compose/core/docker-compose.yml up -d --wait
      - docker compose --env-file deploy/env/.env -f deploy/compose/observability/docker-compose.yml up -d
      - docker compose --env-file deploy/compose/auth/.env -f deploy/compose/auth/docker-compose.yml up -d --build --wait
      - docker compose --env-file deploy/compose/inventory/.env -f deploy/compose/inventory/docker-compose.yml up -d --build --wait
      - docker compose --env-file deploy/compose/payment/.env -f deploy/compose/payment/docker-compose.yml up -d --build
      - docker compose --env-file deploy/compose/order/.env -f deploy/compose/order/docker-compose.yml up -d --build --wait
      - docker compose --env-file deploy/compose/assembly/.env -f deploy/compose/assembly/docker-compose.yml up -d --build
      - docker compose --env-file deploy/compose/notification/.env -f deploy/compose/notification/docker-compose.yml up -d --build
      - docker compose -f deploy/compose/gateway/docker-compose.yml up -d
      - task: ps

  down:
    desc: Останавливает весь проект без удаления данных
    cmds:
      - docker compose -f deploy/compose/gateway/docker-compose.yml down
      - docker compose --env-file deploy/compose/notification/.env -f deploy/compose/notification/docker-compose.yml down
      - docker compose --env-file deploy/compose/assembly/.env -f deploy/compose/assembly/docker-compose.yml down
      - docker compose --env-file deploy/compose/order/.env -f deploy/compose/order/docker-compose.yml down
      - docker compose --env-file deploy/compose/payment/.env -f deploy/compose/payment/docker-compose.yml down
      - docker compose --env-file deploy/compose/inventory/.env -f deploy/compose/inventory/docker-compose.yml down
      - docker compose --env-file deploy/compose/auth/.env -f deploy/compose/auth/docker-compose.yml down
      - docker compose --env-file deploy/env/.env -f deploy/compose/observability/docker-compose.yml down
      - docker compose -f deploy/compose/core/docker-compose.yml down

  restart:
    desc: Перезапускает проект
    cmds:
      - task: down
      - task: up

  ps:
    desc: Показывает контейнеры проекта
    cmds:
      - docker ps --filter network=microservices-net

  logs:
    desc: Показывает логи контейнера, SERVICE=order_service по умолчанию
    vars:
      SERVICE: '{{default "order_service" .SERVICE}}'
    cmds:
      - docker logs --follow {{.SERVICE}}

  seed-inventory:
    desc: Повторно запускает идемпотентный MongoDB seed
    cmds:
      - docker compose --env-file deploy/compose/inventory/.env -f deploy/compose/inventory/docker-compose.yml run --rm inventory-seed

  smoke:
    desc: Проверяет доступность gateway и интерфейсов observability
    cmds:
      - curl --fail http://localhost:8088/docs >/dev/null
      - curl --fail http://localhost:9090/-/healthy >/dev/null
      - curl --fail http://localhost:3000/api/health >/dev/null
      - curl --fail http://localhost:16686/ >/dev/null
      - curl --fail http://localhost:5601/api/status >/dev/null
